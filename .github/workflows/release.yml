name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Retry npm publication and Homebrew update on a stable v* tag
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Prepare version pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run check:packages
      - run: pnpm run check:versions
      - run: pnpm run license-check

      - name: Create or update the version pull request
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag and versioned tree
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/browser-review/package.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || process.env.TAG !== `v${version}`) {
            throw new Error('Expected a stable v<version> tag matching the CLI package.json');
          }
          if (readdirSync('.changeset').some(name => name.endsWith('.md') && name !== 'README.md')) {
            throw new Error('Merge the version PR before tagging: pending changesets remain');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run check:packages
      - run: pnpm run check:versions
      - run: pnpm run license-check
      - name: Publish versioned packages
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
        env:
          # First publication uses this short-lived repository secret. Remove it
          # after configuring Trusted Publishing; an empty value allows OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate formula from the published npm archive
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p .output/homebrew
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 30 \
            --retry 60 --retry-all-errors --retry-delay 15 --retry-max-time 900 \
            "https://registry.npmjs.org/browser-review/-/browser-review-${VERSION}.tgz" \
            --output .output/homebrew/browser-review.tgz
          node scripts/generate-homebrew-formula.mjs .output/homebrew/browser-review.tgz
          ruby -c .output/homebrew/browser-review.rb
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: .output/homebrew/browser-review.rb
          include-hidden-files: true
          if-no-files-found: error
      - name: Check tap credentials
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is unset; download the homebrew-formula artifact to update the tap manually."
          fi
      - uses: actions/checkout@v7
        if: steps.tap.outputs.enabled == 'true'
        with:
          repository: kechol/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .output/homebrew-tap
      - name: Publish Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p .output/homebrew-tap/Formula
          cp .output/homebrew/browser-review.rb .output/homebrew-tap/Formula/browser-review.rb
          cd .output/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/browser-review.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
          else
            git commit -s -m "chore: update browser-review to $VERSION"
            git push
          fi

name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste annotation text, page content, or anything from a
        real product into this form. A reduced example is more useful anyway.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. npx browser-review open ./page.html
        2. Click …
        3. …
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - html-file (a local .html file)
        - proxy (a http://localhost dev server)
        - not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `npx browser-review --help | head -1`, `node -v`, and your OS.
      placeholder: browser-review 0.1.0, node v22.12.0, macOS 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: >
        From `$XDG_STATE_HOME/browser-review/logs/` (or
        `~/.local/state/browser-review/logs/`). Check it for anything you would
        rather not publish before pasting.
      render: shell
